{{define "content"}}
<h2>注册 (PoW {{.PowMinutes}} 分钟)</h2>
<div id="pow-status" style="color:#fa0"></div>
<div id="pow-progress-container" style="display:none; width:100%; height:12px; background:#222; border:1px solid #444; margin:6px 0; overflow:hidden"><div id="pow-progress" style="height:100%; width:0%; background:#7ab8ff; transition:width 0.15s"></div></div>
<form method="POST" action="/register" data-pow-scope="register">
<input name="username" placeholder="用户名 3-20 字母数字_" required pattern="[a-zA-Z0-9_]{3,20}" style="width:100%;margin:4px 0">
<input name="password" type="password" placeholder="密码 6-72位" required minlength="6" maxlength="72" style="width:100%;margin:4px 0">
{{if .NeedInvite}}<input name="invite_code" placeholder="邀请码" required style="width:100%;margin:4px 0">{{end}}
<button>注册 (需PoW)</button>
</form>
<p>已有账号？<a href="/login">登录</a></p>
<p style="color:#888">注册模式: {{.RegMode}} | 无邮箱找回，丢密即丢号</p>
{{end}}
