{{define "content"}}
<h2>登录 (PoW {{.PowMinutes}} 分钟)</h2>
<div id="pow-status" style="color:#fa0"></div>
<div id="pow-progress-container" style="display:none; width:100%; height:12px; background:#222; border:1px solid #444; margin:6px 0; overflow:hidden"><div id="pow-progress" style="height:100%; width:0%; background:#7ab8ff; transition:width 0.15s"></div></div>
<form method="POST" action="/login" data-pow-scope="login">
<input name="username" placeholder="用户名" required style="width:100%;margin:4px 0">
<input name="password" type="password" placeholder="密码" required style="width:100%;margin:4px 0">
<button>登录 (需PoW)</button>
</form>
<p><a href="/register">注册</a></p>
{{end}}
