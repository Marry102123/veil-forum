<h2>{{ login_label | default(value="Log in") }} <span class="muted" style="font-weight:400">· {{ pow_title }}</span></h2><p class="muted pow-explanation">{{ pow_description }}</p><div id="pow-status" data-computing="{{ pow_computing }}" data-done="{{ pow_done }}" data-failed="{{ pow_failed }}" data-submitting="{{ pow_submitting }}"></div><div id="pow-progress-container" style="display:none"><div id="pow-progress"></div></div><form method="POST" action="/login" data-pow-scope="login" style="max-width:420px">{{ csrf_field | default(value="") | safe }}<input name="username" placeholder="{{ username_label | default(value="Username") }}" aria-label="{{ username_label | default(value="Username") }}" required style="width:100%;margin:5px 0"><input name="password" type="password" placeholder="{{ password_label | default(value="Password") }}" aria-label="{{ password_label | default(value="Password") }}" required style="width:100%;margin:5px 0">{{ pow_fallback | default(value="") | safe }}<button class="btn-primary" style="width:100%;margin-top:6px">{{ login_label | default(value="Log in") }}</button></form><p style="font-size:12.5px"><a href="/register">{{ register_label | default(value="Register") }}</a> <span class="muted">· {{ email_hint | default(value="no email required") }}</span></p>
