<section class="admin-hub">
  <header class="admin-hub-header">
    <h2>{{ admin_label }}</h2>
    <p class="muted">{{ admin_help }}</p>
  </header>
  <div class="admin-hub-grid">
    <a class="admin-hub-entry" href="/governance">
      <span class="admin-hub-entry-label">{{ governance_label }}</span>
      <span class="admin-hub-entry-help">{{ governance_help }}</span>
      <span class="admin-hub-entry-arrow" aria-hidden="true">→</span>
    </a>
    <a class="admin-hub-entry" href="/admin/settings">
      <span class="admin-hub-entry-label">{{ system_settings_label }}</span>
      <span class="admin-hub-entry-help">{{ system_settings_help }}</span>
      <span class="admin-hub-entry-arrow" aria-hidden="true">→</span>
    </a>
  </div>
</section>
