[graph]
targets = []
all-features = true

[advisories]
version = 2
# No advisories are ignored here: with `all-features = true` cargo-deny resolves
# the graph of the features this crate actually enables, and nothing flagged is
# reachable from it. The previous list was retired piece by piece:
#   * yaml-rust and bincode: removed by turning Comrak's default features off, so
#     its unused CLI and syntax-highlighting stack is not built;
#   * the seven `unic-*` entries: never present in the lockfile at all, so they
#     were over-ignored rather than needed;
#   * rsa (RUSTSEC-2023-0071) is still *declared* by the unused `sqlx-mysql`
#     entry in Cargo.lock. It is not built, because sqlx is used with
#     `default-features = false` and only the `postgres` feature, which is why
#     cargo-deny is clean here. `cargo audit` scans the lockfile instead of the
#     feature graph and so still needs `--ignore RUSTSEC-2023-0071`; the
#     limitation is recorded in CHANGELOG.md.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Unicode-DFS-2016 is the permissive licence of the Unicode data tables that
# comrak pulls in through finl_unicode.
# MPL-2.0 is required by cssparser and dtoa-short, which ammonia pulls into the
# normal build graph, so it must stay. cargo-deny 0.20.2 also lists it as an
# unmatched allowance in the same run; deleting it makes `cargo deny check`
# fail with `failed to satisfy license requirements`.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "AGPL-3.0-only", "MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
