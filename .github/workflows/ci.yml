name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets
      - run: cargo build --release
      - run: cargo install cargo-audit --locked
      # rsa has no fixed upgrade; the limitation is documented in CHANGELOG.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  release-build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            image: messense/rust-musl-cross:x86_64-musl
          - target: aarch64-unknown-linux-musl
            image: messense/rust-musl-cross:aarch64-musl
          - target: armv7-unknown-linux-musleabihf
            image: messense/rust-musl-cross:armv7-musleabihf
          - target: riscv64gc-unknown-linux-musl
            image: messense/rust-musl-cross:riscv64-musl
          - target: x86_64-unknown-linux-gnu
            image: ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main
          - target: aarch64-unknown-linux-gnu
            image: ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main
          - target: i686-unknown-linux-musl
            image: messense/rust-musl-cross:i686-musl
          - target: powerpc64le-unknown-linux-gnu
            image: ghcr.io/cross-rs/powerpc64le-unknown-linux-gnu:main
          - target: s390x-unknown-linux-gnu
            image: ghcr.io/cross-rs/s390x-unknown-linux-gnu:main
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Build static musl binary
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.image }}
          options: -v ${{ github.workspace }}:/volume
          run: |
            cd /volume
            cargo build --release --target ${{ matrix.target }}
      - run: |
          mkdir -p package/veil-forum-${GITHUB_REF_NAME}
          cp target/${{ matrix.target }}/release/veil-forum package/veil-forum-${GITHUB_REF_NAME}/
          cp -r static locales migrations deploy docs LICENSE README.md CHANGELOG.md SECURITY.md package/veil-forum-${GITHUB_REF_NAME}/
          tar -czf veil-forum-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz -C package veil-forum-${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: veil-forum-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - run: |
          ls -l veil-forum-*.tar.gz
          sha256sum veil-forum-*.tar.gz > veil-forum-${GITHUB_REF_NAME}-checksums.txt
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "veil-forum $GITHUB_REF_NAME" \
            --generate-notes \
            veil-forum-*.tar.gz veil-forum-*-checksums.txt
