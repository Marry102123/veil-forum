name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install and start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client binutils age
          sudo systemctl start postgresql
      - name: Create the least-privilege test role and database
        # The fault-injection suites prove fail-closed behaviour by revoking a
        # privilege from the role the pool authenticates as, and a superuser
        # bypasses privilege checks, so the suite must run as a non-superuser:
        # LOGIN plus CREATEDB for the disposable databases it creates, and
        # nothing else. Over the Unix socket, peer authentication maps the
        # runner's OS user to that role, so the URL carries no password and no
        # password literal is needed here.
        run: |
          sudo -u postgres createuser --createdb --no-superuser "$USER"
          sudo -u postgres createdb -O "$USER" veil_forum_test
          echo "DATABASE_URL=postgres://$USER@%2Fvar%2Frun%2Fpostgresql/veil_forum_test" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Run tests against PostgreSQL
        run: cargo test --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --release
      - name: Run shell script smoke tests
        run: tests/scripts.sh
      - name: Run deployment script tests
        run: tests/deploy-scripts.sh
      - name: Run startup, health, and SIGTERM smoke test
        run: tests/startup-smoke.sh
      - name: Run real backup, upgrade, and rollback E2E
        run: sh tests/backup_upgrade_e2e.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-e2e-reports
          path: |
            target/auth-e2e-report.json
            target/config-effects-e2e-report.json
            target/forum-lifecycle-e2e-report.json
            target/governance-e2e-report.json
            target/search-privacy-e2e-report.json
            target/config-effects-e2e-stderr.jsonl
            target/backup-upgrade-e2e-report.json
            target/startup-smoke-report.json
            target/totp-http-e2e-report.json
      - name: Cache the pinned audit tools
        # `cargo install` compiles cargo-audit and cargo-deny from source, which
        # is most of this job's runtime. rust-cache cannot help with that: its
        # key follows Cargo.lock, and every dependency PR changes that file. The
        # two tools are pinned by version, so they are cached under a key that
        # changes only when a pin below changes, and the install steps then
        # report them as already installed instead of rebuilding them.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: audit-tools-${{ runner.os }}-cargo-audit-0.22.2-cargo-deny-0.20.2
      - name: Install pinned cargo-audit
        # Pinned for reproducibility, but not older than this: rustsec advisory
        # entries using CVSS 4.0 fail to parse in cargo-audit <= 0.21.2, and the
        # same advisory database breaks cargo-deny <= 0.18.4.
        run: cargo install cargo-audit --version 0.22.2 --locked
      # rsa has no fixed upgrade; the limitation is documented in CHANGELOG.
      - name: Run pinned cargo-audit
        run: |
          set -o pipefail
          cargo audit --version
          cargo audit --ignore RUSTSEC-2023-0071 | tee target/cargo-audit.txt
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Run pinned cargo-deny
        run: |
          set -o pipefail
          cargo deny --version
          cargo deny check | tee target/cargo-deny.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: supply-chain-audit
          path: |
            target/cargo-audit.txt
            target/cargo-deny.txt

  release-build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
          - target: armv7-unknown-linux-musleabihf
          - target: riscv64gc-unknown-linux-musl
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
          - target: i686-unknown-linux-musl
          - target: powerpc64le-unknown-linux-gnu
          - target: s390x-unknown-linux-gnu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        if: matrix.target != 'powerpc64le-unknown-linux-gnu'
        with:
          version: 0.14.0
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: matrix.target != 'powerpc64le-unknown-linux-gnu'
        with:
          tool: cargo-zigbuild
      - name: Install PowerPC64LE GNU toolchain
        if: matrix.target == 'powerpc64le-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-powerpc64le-linux-gnu
      - name: Build target binary
        run: |
          if [ "${{ matrix.target }}" = "powerpc64le-unknown-linux-gnu" ]; then
            CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_LINKER=powerpc64le-linux-gnu-gcc \
              cargo build --release --target ${{ matrix.target }}
          else
            cargo zigbuild --release --target ${{ matrix.target }}
          fi
      - run: |
          mkdir -p package/veil-forum-${GITHUB_REF_NAME}
          cp target/${{ matrix.target }}/release/veil-forum package/veil-forum-${GITHUB_REF_NAME}/
          cp -r static locales migrations deploy docs LICENSE README.md CHANGELOG.md SECURITY.md package/veil-forum-${GITHUB_REF_NAME}/
          tar -czf veil-forum-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz -C package veil-forum-${GITHUB_REF_NAME}
      - name: Verify release archive and ELF target
        run: |
          set -eu
          archive="veil-forum-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          binary="target/${{ matrix.target }}/release/veil-forum"
          test -s "$binary"
          test "$(head -c 4 "$binary")" = "$(printf '\177ELF')"
          case "${{ matrix.target }}" in
            x86_64-*) expected='Advanced Micro Devices X86-64' ;;
            aarch64-*) expected='AArch64' ;;
            armv7-*) expected='ARM' ;;
            riscv64gc-*) expected='RISC-V' ;;
            i686-*) expected='Intel 80386' ;;
            powerpc64le-*) expected='PowerPC64' ;;
            s390x-*) expected='IBM S/390' ;;
          esac
          readelf -h "$binary" | grep -F "$expected"
          tar -tzf "$archive" | grep -Fx "veil-forum-${GITHUB_REF_NAME}/veil-forum"
          tar -tzf "$archive" | grep -Fx "veil-forum-${GITHUB_REF_NAME}/deploy/veil-forum.service"
          tar -tzf "$archive" | grep -Fx "veil-forum-${GITHUB_REF_NAME}/static/style.css"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: veil-forum-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  stage-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-build
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.stage_release.outputs.release_id }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      - run: |
          set -eu
          ls -l veil-forum-*.tar.gz
          sha256sum veil-forum-*.tar.gz > veil-forum-${GITHUB_REF_NAME}-checksums.txt
          sha256sum -c veil-forum-${GITHUB_REF_NAME}-checksums.txt
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign every release payload with keyless Sigstore identity
        run: |
          set -eu
          for blob in veil-forum-*.tar.gz veil-forum-*-checksums.txt; do
            test -s "$blob"
            cosign sign-blob --yes \
              --bundle "$blob.sig" \
              --output-certificate "$blob.pem" \
              "$blob"
          done
      - name: Stage draft GitHub Release assets
        id: stage_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "veil-forum $GITHUB_REF_NAME" \
            --generate-notes \
            veil-forum-*.tar.gz veil-forum-*.tar.gz.sig veil-forum-*.tar.gz.pem \
            veil-forum-*-checksums.txt veil-forum-*-checksums.txt.sig veil-forum-*-checksums.txt.pem
          # Hand the exact draft id to the validation job. A retried tag leaves
          # several drafts with the same tag name, and the validation job's
          # read-only token cannot enumerate drafts at all, so it must not
          # search for the release it is meant to verify.
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | \"\(.created_at) \(.id)\"" \
            | sort | tail -n 1 | cut -d' ' -f2)
          test -n "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "staged draft release $release_id for $GITHUB_REF_NAME"

  release-package-e2e:
    if: startsWith(github.ref, 'refs/tags/')
    needs: stage-release
    runs-on: ubuntu-latest
    permissions:
      # GitHub only serves draft releases to a token that can write contents, so
      # a read-only token cannot verify the draft this job is gating. The job
      # still never writes: `RELEASE_ID` pins the exact release, and publishing
      # is a separate job with its own token. Without this the check would be
      # structurally unable to run against a draft.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      # The exact draft created by stage-release, so the job never searches for
      # a release and cannot be confused by drafts left by an earlier retry.
      RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release E2E prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client binutils file age
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Verify published GitHub Release packages
        run: tests/release_packages_e2e.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-packages-e2e-report
          path: |
            target/release-packages-e2e-report.json
            target/release-packages-e2e-logs/

  finalize-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [stage-release, release-package-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      # Publish exactly the release that was validated, addressed by id.
      RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
    steps:
      - name: Publish verified draft release
        run: |
          set -eu
          test -n "$RELEASE_ID"
          # `gh release edit <tag>` resolves the tag through a local git
          # checkout, which this job intentionally does not have. Patch the
          # release by its numeric id instead, so publishing cannot depend on a
          # clone or silently target a different release sharing the tag.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" \
            -f draft=false > /dev/null
          draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" --jq '.draft')
          test "$draft" = "false"
          echo "published $RELEASE_TAG as release $RELEASE_ID"
