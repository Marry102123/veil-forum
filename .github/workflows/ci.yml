name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets
      - run: cargo build --release
      - run: cargo install cargo-audit --locked
      # rsa has no fixed upgrade; the limitation is documented in CHANGELOG.
      - run: cargo audit --ignore RUSTSEC-2023-0071

  release-build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: |
          mkdir -p package/veil-forum-${GITHUB_REF_NAME}
          cp target/release/veil-forum package/veil-forum-${GITHUB_REF_NAME}/
          cp -r static locales migrations deploy docs LICENSE README.md CHANGELOG.md SECURITY.md package/veil-forum-${GITHUB_REF_NAME}/
          tar -czf veil-forum-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz -C package veil-forum-${GITHUB_REF_NAME}
      - run: sha256sum veil-forum-*.tar.gz > veil-forum-${GITHUB_REF_NAME}-checksums.txt
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "veil-forum $GITHUB_REF_NAME" \
            --generate-notes \
            veil-forum-*.tar.gz veil-forum-*-checksums.txt
