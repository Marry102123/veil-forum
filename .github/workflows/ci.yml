name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/veil_forum_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install and start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client binutils age
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE postgres PASSWORD 'postgres'" \
            -c "CREATE DATABASE veil_forum_test"
      - run: cargo fmt --all -- --check
      - name: Run tests against PostgreSQL
        run: cargo test --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --release
      - name: Run shell script smoke tests
        run: tests/scripts.sh
      - name: Run deployment script tests
        run: tests/deploy-scripts.sh
      - name: Run startup, health, and SIGTERM smoke test
        run: tests/startup-smoke.sh
      - name: Run real backup, upgrade, and rollback E2E
        run: sh tests/backup_upgrade_e2e.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rust-e2e-reports
          path: |
            target/auth-e2e-report.json
            target/config-effects-e2e-report.json
            target/forum-lifecycle-e2e-report.json
            target/governance-e2e-report.json
            target/search-privacy-e2e-report.json
            target/config-effects-e2e-stderr.jsonl
            target/backup-upgrade-e2e-report.json
      - run: cargo install cargo-audit --locked
      # rsa has no fixed upgrade; the limitation is documented in CHANGELOG.
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  release-build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
          - target: armv7-unknown-linux-musleabihf
          - target: riscv64gc-unknown-linux-musl
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
          - target: i686-unknown-linux-musl
          - target: powerpc64le-unknown-linux-gnu
          - target: s390x-unknown-linux-gnu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        if: matrix.target != 'powerpc64le-unknown-linux-gnu'
        with:
          version: 0.14.0
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        if: matrix.target != 'powerpc64le-unknown-linux-gnu'
        with:
          tool: cargo-zigbuild
      - name: Install PowerPC64LE GNU toolchain
        if: matrix.target == 'powerpc64le-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-powerpc64le-linux-gnu
      - name: Build target binary
        run: |
          if [ "${{ matrix.target }}" = "powerpc64le-unknown-linux-gnu" ]; then
            CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_LINKER=powerpc64le-linux-gnu-gcc \
              cargo build --release --target ${{ matrix.target }}
          else
            cargo zigbuild --release --target ${{ matrix.target }}
          fi
      - run: |
          mkdir -p package/veil-forum-${GITHUB_REF_NAME}
          cp target/${{ matrix.target }}/release/veil-forum package/veil-forum-${GITHUB_REF_NAME}/
          cp -r static locales migrations deploy docs LICENSE README.md CHANGELOG.md SECURITY.md package/veil-forum-${GITHUB_REF_NAME}/
          tar -czf veil-forum-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz -C package veil-forum-${GITHUB_REF_NAME}
      - name: Verify release archive and ELF target
        run: |
          set -eu
          archive="veil-forum-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          binary="target/${{ matrix.target }}/release/veil-forum"
          test -s "$binary"
          test "$(head -c 4 "$binary")" = "$(printf '\177ELF')"
          case "${{ matrix.target }}" in
            x86_64-*) expected='Advanced Micro Devices X86-64' ;;
            aarch64-*) expected='AArch64' ;;
            armv7-*) expected='ARM' ;;
            riscv64gc-*) expected='RISC-V' ;;
            i686-*) expected='Intel 80386' ;;
            powerpc64le-*) expected='PowerPC64' ;;
            s390x-*) expected='IBM S/390' ;;
          esac
          readelf -h "$binary" | grep -F "$expected"
          tar -tzf "$archive" | grep -Fx "veil-forum-${GITHUB_REF_NAME}/veil-forum"
          tar -tzf "$archive" | grep -Fx "veil-forum-${GITHUB_REF_NAME}/deploy/veil-forum.service"
          tar -tzf "$archive" | grep -Fx "veil-forum-${GITHUB_REF_NAME}/static/style.css"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: veil-forum-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  stage-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
      - run: |
          set -eu
          ls -l veil-forum-*.tar.gz
          sha256sum veil-forum-*.tar.gz > veil-forum-${GITHUB_REF_NAME}-checksums.txt
          sha256sum -c veil-forum-${GITHUB_REF_NAME}-checksums.txt
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign every release payload with keyless Sigstore identity
        run: |
          set -eu
          for blob in veil-forum-*.tar.gz veil-forum-*-checksums.txt; do
            test -s "$blob"
            cosign sign-blob --yes \
              --bundle "$blob.sig" \
              --output-certificate "$blob.pem" \
              "$blob"
          done
      - name: Stage draft GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "veil-forum $GITHUB_REF_NAME" \
            --generate-notes \
            veil-forum-*.tar.gz veil-forum-*.tar.gz.sig veil-forum-*.tar.gz.pem \
            veil-forum-*-checksums.txt veil-forum-*-checksums.txt.sig veil-forum-*-checksums.txt.pem

  release-package-e2e:
    if: startsWith(github.ref, 'refs/tags/')
    needs: stage-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release E2E prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client binutils file age
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Verify published GitHub Release packages
        run: tests/release_packages_e2e.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-packages-e2e-report
          path: |
            target/release-packages-e2e-report.json
            target/release-packages-e2e-logs/

  finalize-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-package-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
